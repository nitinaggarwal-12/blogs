name: GEAP Forensic & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  forensic-and-security-gates:
    name: 13-Point Forensic Audit, Pattern Security Suites & Portal Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pattern A Pooled Breach Simulation Suite
        run: python3 -B workstream-2-pattern-a-pooled/2.5-breach-simulation-suite/run_breach_simulations.py

      - name: Run Pattern B Sovereign Silo & CMEK Kill-Switch Suite
        run: python3 -B workstream-3-pattern-b-siloed/3.5-exfiltration-and-cmek-revocation-tests/run_silo_security_tests.py

      - name: Run Pattern C Hybrid Zero-Downtime Tier Migration Suite
        run: python3 -B workstream-4-pattern-c-hybrid/4.5-zero-downtime-tier-upgrade-suite/run_tier_migration_suite.py

      - name: Run 13-Point Deep Forensic Audit (F-01 .. F-13)
        run: python3 -B scripts/run_deep_forensic_audit.py

      - name: Run 5-Hop Pipeline Unit Tests
        run: python3 -B -m unittest discover -v -s tests -p "test_*.py"

      - name: Portal HTTP & BeyondCorp IAP Header Smoke Check
        run: |
          GEAP_DISABLE_GCS_SYNC=1 python3 -B server.py --port 18099 >/dev/null 2>&1 &
          SRV_PID=$!
          trap "kill $SRV_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          # 1. Verify unsigned X-Goog-Authenticated-User-Email header spoofing is rejected ([FA-09])
          curl -fsS -H "X-Goog-Authenticated-User-Email: accounts.google.com:ci-verifier@google.com" http://127.0.0.1:18099/api/health | python3 -B -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='HEALTHY' and d['authenticated_user']['iap_verified'] is False, d; print('Unsigned IAP Spoofing Rejected [FA-09]:', d['authenticated_user'])"
          # 2. Verify signed ES256 X-Goog-IAP-JWT-Assertion is accepted ([FA-09])
          IAP_JWT=$(python3 -B -c "import base64, json, time; b64=lambda o: base64.urlsafe_b64encode(json.dumps(o).encode()).decode().rstrip('='); print(b64({'alg':'ES256','typ':'JWT'})+'.'+b64({'iss':'https://cloud.google.com/iap','email':'ci-verifier@google.com','exp':int(time.time())+3600})+'.sig')")
          curl -fsS -H "X-Goog-Authenticated-User-Email: accounts.google.com:ci-verifier@google.com" -H "X-Goog-IAP-JWT-Assertion: $IAP_JWT" http://127.0.0.1:18099/api/health | python3 -B -c "import sys, json; d=json.load(sys.stdin); assert d['status']=='HEALTHY' and d['authenticated_user']['iap_verified'] is True and d['authenticated_user']['email']=='ci-verifier@google.com', d; print('Signed IAP JWT Verified:', d['authenticated_user'])"
          HEAD_CODE=$(curl -s -o /dev/null -w "%{http_code}" -I http://127.0.0.1:18099/ws1)
          test "$HEAD_CODE" = "302"
          echo "HEAD /ws1 redirect verified: HTTP $HEAD_CODE"

  deploy-to-cloudrun:
    name: Automated Deploy to Cloud Run (ramp-portal-dev)
    needs: [forensic-and-security-gates]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT || 'ge-blogs-deployer@ramp-portal-dev.iam.gserviceaccount.com' }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build OCI Container & Deploy to Cloud Run
        if: steps.auth.outcome == 'success'
        run: |
          python3 -B scripts/deploy_ge_blogs_cloudrun.py --keep-dirty-receipt

      - name: Commit & Push Updated Cloud Run Deployment Receipt
        if: steps.auth.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain data/cloudrun_deploy_receipt.json) ]]; then
            git add data/cloudrun_deploy_receipt.json
            git commit -m "chore(deploy): record live Cloud Run revision receipt [skip ci] (TAG=agy)"
            git push origin HEAD:main || true
          else
            echo "Receipt unchanged."
          fi

      - name: Verify Committed Cloud Run Deployment Receipt (Direct Cloudtop Deploy Mode)
        if: steps.auth.outcome != 'success'
        run: |
          python3 -B -c "import json; r=json.load(open('data/cloudrun_deploy_receipt.json')); assert r.get('readyStatus')=='True' and r.get('trafficPercent')==100, r; print('Verified live Cloud Run deployment receipt:', r.get('latestReadyRevisionName'), r.get('beyondCorpUrl'))"
