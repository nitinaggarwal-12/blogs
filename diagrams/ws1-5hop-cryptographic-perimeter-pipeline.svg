<rect x="56" y="144" width="332" height="62" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/><text x="68" y="170" font-size="15" font-weight="bold" font-family="Arial,sans-serif" fill="#1D4ED8">1. Ingress &amp; Edge PEP</text><text x="68" y="191" font-size="11.5" font-family="Arial,sans-serif" fill="#475569">Header stripping &amp; STS token exchange</text>
<rect x="56" y="220" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="68" y="246" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Hop 1 Edge PEP Strip</text>
<text x="68" y="268" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">External ALB + Cloud Armor WAF strip caller</text>
<text x="68" y="286" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">X-Tenant-Id before app code runs.</text>
<rect x="56" y="358" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="68" y="384" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">IAM STS Token Broker</text>
<text x="68" y="406" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">RFC 8693 OBO + RFC 9449 DPoP mint 5-min ECDSA</text>
<text x="68" y="424" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">P-256 TenantContext JWT.</text>
<rect x="56" y="496" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="68" y="522" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">In-Memory JWKS + JTI</text>
<text x="68" y="544" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">&lt;0.15ms ECDSA verify via hot JWKS; 0.4ms</text>
<text x="68" y="562" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Valkey JTI single-use replay guard.</text>
<rect x="56" y="634" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="68" y="660" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Fail-Closed HTTP 401</text>
<text x="68" y="682" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Missing, forged, expired, or replayed</text>
<text x="68" y="700" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">OIDC/DPoP tokens terminate at edge.</text>
