<rect x="436" y="144" width="332" height="62" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/><text x="448" y="170" font-size="15" font-weight="bold" font-family="Arial,sans-serif" fill="#B06000">2. ARD PDP &amp; Bulkhead</text><text x="448" y="191" font-size="11.5" font-family="Arial,sans-serif" fill="#475569">Tool catalog pruning &amp; Valkey rate caps</text>
<rect x="436" y="220" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="448" y="246" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">ARD Catalog Policy (Hop 2)</text>
<text x="448" y="268" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Agent Registry filters MCP tool schemas per</text>
<text x="448" y="286" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">tenant; blocks cross-tenant calls.</text>
<rect x="436" y="358" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="448" y="384" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">gVisor 1-Turn Heap Wipe</text>
<text x="448" y="406" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Cloud Run Gen2 CoW concurrency=1 + gVisor</text>
<text x="448" y="424" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">syscall isolation; no /tmp leaks.</text>
<rect x="436" y="496" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="448" y="522" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Memorystore Valkey 0.4ms</text>
<text x="448" y="544" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Atomic token-bucket Lua quota: 120 RPM</text>
<text x="448" y="562" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">standard / 600 RPM enterprise burst.</text>
<rect x="436" y="634" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="448" y="660" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Deterministic 403 &amp; 429</text>
<text x="448" y="682" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Disallowed MCP tools return HTTP 403;</text>
<text x="448" y="700" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">noisy-neighbor spikes return HTTP 429.</text>
