<text x="44" y="95" font-size="13" font-family="Arial,sans-serif" fill="#475569">End-to-end zero-trust defense across Ingress PEP (Hop 1), ARD PDP &amp; Valkey Bulkheads (Hops 2–3), Model Armor DLP (Hop 4) &amp; AlloyDB RLS / CMEK (Hop 5).</text>
