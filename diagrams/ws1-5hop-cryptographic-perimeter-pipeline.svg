<rect x="1196" y="220" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1208" y="246" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">AlloyDB FORCE RLS (Pool)</text>
<text x="1208" y="268" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Middleware sets SET LOCAL</text>
<text x="1208" y="286" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">app.current_tenant_id; PgBouncer issues</text>
<text x="1208" y="304" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">DISCARD ALL.</text>
<rect x="1196" y="358" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1208" y="384" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Pre-Filtered HNSW RAG</text>
<text x="1208" y="406" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Inline SQL RLS predicates prune foreign</text>
<text x="1208" y="424" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">vectors before distance scoring.</text>
<rect x="1196" y="496" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1208" y="522" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Per-Tenant HSM CMEK</text>
<text x="1208" y="544" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Dedicated Cloud KMS FIPS 140-3 Level 3 rings</text>
<text x="1208" y="562" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">isolate sovereign tenant storage.</text>
<rect x="1196" y="634" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1208" y="660" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Sub-60s HTTP 423 Halt</text>
<text x="1208" y="682" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Disabling tenant CMEK triggers &lt;60s (41.2s</text>
<text x="1208" y="700" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">measured) lock &amp; &lt;5s Valkey purge.</text>
