<text x="828" y="268" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Model Armor scans every user prompt, RAG chunk</text>
<text x="828" y="286" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">&amp; MCP response inline.</text>
<rect x="816" y="358" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="828" y="384" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Dual-Path PII / PHI DLP</text>
<text x="828" y="406" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Detects cross-tenant secrets, PCI PANs, and</text>
<text x="828" y="424" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">sensitive entities pre-egress.</text>
<rect x="816" y="496" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="828" y="522" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">32k Shared Prefix Cache</text>
<text x="828" y="544" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">32,768 system tokens cached globally at 0.10x</text>
<text x="828" y="562" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">rate -&gt; 89.1% net input savings.</text>
<rect x="816" y="634" width="332" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="828" y="660" font-size="12.5" font-weight="bold" font-family="Arial,sans-serif" fill="#0F172A">Jailbreak Halt HTTP 422</text>
<text x="828" y="682" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">Indirect prompt injection or unauthorized tool</text>
<text x="828" y="700" font-size="11.2" font-family="Arial,sans-serif" fill="#334155">coercion aborts with HTTP 422.</text>
