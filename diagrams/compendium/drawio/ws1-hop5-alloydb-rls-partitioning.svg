<text x="120.0" y="510.7" text-anchor="start" fill="#0D47A1" font-size="14.3" font-weight="bold">HOW ALLOYDB POSTGRESQL ROW-LEVEL SECURITY ENFORCES ZERO-TRUST PRIVACY</text>
<rect x="108.0" y="534.0" width="318.0" height="252.0" rx="18" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.0"/>
<text x="132.0" y="581.9" text-anchor="start" fill="#0D47A1" font-size="11.1" font-weight="bold">STEP 1: CONNECTION CHECKOUT</text>
<text x="132.0" y="648.0" text-anchor="start" fill="#5F6368" font-size="10.4" font-weight="bold"><tspan x="132.0" dy="0">When the agent checks out a connection</tspan><tspan x="132.0" dy="15.5">from the pool, the session state is</tspan><tspan x="132.0" dy="15.5">pristine. No tenant context exists.</tspan></text>
<rect x="453.6" y="534.0" width="318.0" height="252.0" rx="18" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.0"/>
<text x="477.6" y="581.9" text-anchor="start" fill="#0D47A1" font-size="11.1" font-weight="bold">STEP 2: SET LOCAL APP.CURRENT_TENANT_ID</text>
<text x="477.6" y="648.0" text-anchor="start" fill="#5F6368" font-size="10.4" font-weight="bold"><tspan x="477.6" dy="0">Middleware extracts verified tenant_id</tspan><tspan x="477.6" dy="15.5">from JWT and issues SET LOCAL. Caveat:</tspan><tspan x="477.6" dy="15.5">Auto-resets on COMMIT; with PgBouncer</tspan><tspan x="477.6" dy="15.5">session mode, pool hooks must issue</tspan><tspan x="477.6" dy="15.5">DISCARD ALL.</tspan></text>
<rect x="799.2" y="534.0" width="318.0" height="252.0" rx="18" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.0"/>
<text x="823.2" y="581.9" text-anchor="start" fill="#0D47A1" font-size="11.1" font-weight="bold">STEP 3: AUTOMATIC PREDICATE ENFORCEMENT</text>
<text x="823.2" y="648.0" text-anchor="start" fill="#5F6368" font-size="10.4" font-weight="bold"><tspan x="823.2" dy="0">AlloyDB rewrites all queries internally:</tspan><tspan x="823.2" dy="15.5">SELECT * FROM ledger WHERE tenant_id =</tspan><tspan x="823.2" dy="15.5">current_setting(&#x27;app.current_tenant_id&#x27;).</tspan></text>
<rect x="1144.8" y="534.0" width="318.0" height="252.0" rx="18" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.0"/>
<text x="1168.8" y="581.9" text-anchor="start" fill="#0D47A1" font-size="11.1" font-weight="bold">STEP 4: SUB-15MS ENGINE FILTERING</text>
<text x="1168.8" y="648.0" text-anchor="start" fill="#5F6368" font-size="10.4" font-weight="bold"><tspan x="1168.8" dy="0">Competitor records are filtered by the</tspan><tspan x="1168.8" dy="15.5">PostgreSQL engine before disk pages enter</tspan><tspan x="1168.8" dy="15.5">memory. 0 leaked rows guaranteed.</tspan></text>
