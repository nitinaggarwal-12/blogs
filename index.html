            <div class="gcp-exec-pillar-card" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px;">
              <div style="font-size:11px; font-weight:700; color:#059669; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;">${p2Title}</div>

    function renderMarkdownToHtml(md, docRelPath) {
      let body = String(md || '');
      let readingTimeStr = '';
      if (body.startsWith('---\n')) {
        const endIdx = body.indexOf('\n---\n', 4);
        if (endIdx !== -1) {
          const fm = body.slice(4, endIdx);
          body = body.slice(endIdx + 5);
          fm.split('\n').forEach(line => {
            const idx = line.indexOf(':');
            if (idx === -1) return;
            const k = line.slice(0, idx).trim();
            const v = line.slice(idx + 1).trim().replace(/^"|"$/g, '');
            if (k === 'reading_time' && v) readingTimeStr = v;
          });
        }
      }
      const metaBanner = document.getElementById('hub-blog-meta-banner');
      if (metaBanner) {
        metaBanner.style.display = 'none';
      }

      // Strip duplicate un-keyed <!-- E2E_FLOW_START --> ... <!-- E2E_FLOW_END --> appendix from the web article reader
      // (the Markdown file retains it on disk for standalone/Google Docs export, while the web UI provides interactive per-figure flow tabs)
      body = body.replace(/<!--\s*E2E_FLOW_START\s*-->[\s\S]*?<!--\s*E2E_FLOW_END\s*-->/g, '');

      // Strip duplicate "Editable assets: ..." link sentences inside *Figure N.* captions (already provided by the figure card header toolbar)
      body = body.replace(/(\*Figure\s+\d+\.[^\n*]*?)\s*Editable assets:[^\n*]*(\*?)/g, '$1$2');

      // Extract keyed <!-- E2E_FLOW_START:diagId --> ... <!-- E2E_FLOW_END:diagId --> (used in Master E2E Guide) into collapsible accordions
      const e2eBlocks = [];
      body = body.replace(/<!--\s*E2E_FLOW_START:([a-zA-Z0-9_-]+)\s*-->([\s\S]*?)<!--\s*E2E_FLOW_END:\1\s*-->/g, (_, diagId, innerMd) => {
        const token = `@@E2EFLOW_${e2eBlocks.length}@@`;
        e2eBlocks.push({ diagId, innerMd });
        return `\n${token}\n`;
      });

      // Convert fenced code blocks first
      const codeBlocks = [];
      body = body.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const token = `@@CODEBLOCK_${codeBlocks.length}@@`;
        codeBlocks.push(`<pre><div style="font-size:11px; color:var(--link); margin-bottom:6px; text-transform:uppercase;">${escapeHtml(lang || 'code')}</div><code>${escapeHtml(code.trim())}</code></pre>`);
        return token;
      });

      function formatLatexExprToHtml(rawLatex) {
        return escapeHtml(String(rawLatex || '').trim())
          .replace(/\\text\{([^}]*)\}/g, '<span style="font-family:\'Google Sans\',sans-serif;font-style:normal;">$1</span>')
          .replace(/\\sum_\{([^}]*)\}\^\{([^}]*)\}/g, '&sum;<sub>$1</sub><sup>$2</sup>')
          .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, '($1) / ($2)')
          .replace(/\\left\(/g, '(')
          .replace(/\\right\)/g, ')')
          .replace(/\\left\[/g, '[')
          .replace(/\\right\]/g, ']')
          .replace(/_\{([^}]*)\}/g, '<sub>$1</sub>')
          .replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>')
          .replace(/\\alpha(?![a-zA-Z])/g, '&alpha;')
          .replace(/\\tau(?![a-zA-Z])/g, '&tau;')
          .replace(/\\Delta(?![a-zA-Z])/g, '&Delta;')
          .replace(/\\cdot(?![a-zA-Z])/g, '&middot;')
          .replace(/\\times(?![a-zA-Z])/g, '&times;')
          .replace(/\\le(?![a-zA-Z])/g, '&le;')
          .replace(/\\ge(?![a-zA-Z])/g, '&ge;')
          .replace(/\\approx(?![a-zA-Z])/g, '&approx;')
          .replace(/\\quad(?![a-zA-Z])/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
          .replace(/\\_/g, '_');
      }

      // Convert display math blocks ($$ ... $$)
      const mathBlocks = [];
      body = body.replace(/\$\$\s*\n([\s\S]*?)\n\s*\$\$/g, (_, expr) => {
        const token = `@@MATHBLOCK_${mathBlocks.length}@@`;
        const linesHtml = String(expr || '').trim().split('\n').map(l => formatLatexExprToHtml(l)).join('<br/>');
        mathBlocks.push(`<div class="gcp-math-block" style="background:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #1a73e8; border-radius:8px; padding:12px 16px; margin:14px 0; font-family:'Google Sans Mono', 'JetBrains Mono', monospace; font-size:13px; line-height:1.65; color:#0f172a; overflow-x:auto;"><div style="font-size:10.5px; font-weight:700; color:#1a73e8; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; font-family:'Google Sans',sans-serif;">Formal Architectural Invariant &amp; Mathematical Model</div><div>${linesHtml}</div></div>`);
        return `\n${token}\n`;
      });

      const slugCounts = {};
      function buildHeadingAttrs(rawHeadingText) {
        const plain = String(rawHeadingText || '')
          .replace(/`([^`]+)`/g, '$1')
          .replace(/\*\*([^*]+)\*\*/g, '$1')
          .replace(/\*([^*]+)\*/g, '$1')
          .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
          .replace(/<[^>]+>/g, '')
          .trim()
          .toLowerCase();
        const base = plain
          .replace(/[^a-z0-9 _-]/g, '')
          .replace(/ /g, '-');
        const collapsed = plain.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const count = slugCounts[base] || 0;
        slugCounts[base] = count + 1;
        const fullSlug = count === 0 ? base : `${base}-${count}`;
        const collapsedFull = count === 0 ? collapsed : `${collapsed}-${count}`;
        return `id="${escapeHtml(fullSlug)}" data-slug="${escapeHtml(base)}" data-collapsed-slug="${escapeHtml(collapsedFull)}"`;
      }

      function parseMarkdownChunk(chunkText) {
        const lines = chunkText.split('\n');
        let html = '';
        let inTable = false;
        let tableRows = [];
        let quoteLines = [];
        let ulItems = [];
        let olItems = [];

        function formatInline(text) {
          const inlineMathTokens = [];
          const textWithMathPlaceholders = String(text || '').replace(/\$([A-Za-z\\][^$\n]{0,140}?)\$/g, (_, mExpr) => {
            const tok = `@@INLINEMATH_${inlineMathTokens.length}@@`;
            inlineMathTokens.push(`<code style="background:#f1f5f9;color:#0f172a;padding:1px 5px;border-radius:4px;font-style:normal;">${formatLatexExprToHtml(mExpr)}</code>`);
            return tok;
          });
          let out = escapeHtml(textWithMathPlaceholders)
            .replace(/&lt;br\s*\/?&gt;/gi, '<br/>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => {
              const resolved = normalizeRepoPath(resolveRelativeAssetUrl(src, docRelPath));
              const diagMatch = resolved.match(/diagrams\/([a-zA-Z0-9_-]+)\.(?:drawio\.png|svg|png)/);
              const diagId = diagMatch ? diagMatch[1] : '';
              if (!diagId) {
                const slideMatch = resolved.match(/(?:slides\/previews\/)?(ws[1-5])-12slide-visual-deck\/slide_(\d+)\.png/i);
                const isFigureDiagram = Boolean(slideMatch || /^Figure/i.test(alt) || resolved.includes('/slides/previews/'));
                if (isFigureDiagram) {
                  const wsKey = slideMatch ? slideMatch[1].toUpperCase() : (activeHubWsKey || 'WS1');
                  const slideNum = slideMatch ? parseInt(slideMatch[2], 10) : 1;
                  const figSlug = slideMatch ? `${wsKey.toLowerCase()}-slide-${slideNum}` : resolved.replace(/[^a-zA-Z0-9_-]/g, '-');
                  const slideBadgeHtml = slideMatch
                    ? `<button type="button" class="sim-btn" style="padding:4px 9px; font-size:11.5px; border-color:var(--green); color:var(--ok-text); font-weight:700;" onclick="openCloudViewerModal('${wsKey}', ${slideNum}, 'slides')">&#127916; Slide #${slideNum}</button>`
                    : '';
                  return `
                <div class="gcp-figure-card" id="inline-fig-card-${figSlug}" data-card-id="inline-fig-card-${figSlug}" data-diag-id="${figSlug}" data-card-type="diagram" data-card-title="${escapeHtml(alt)}" data-doc-path="${escapeHtml(docRelPath || '')}" style="padding:12px 14px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); padding-right:8px;">
                    <strong class="card-editable-body" id="inline-fig-title-${figSlug}" style="font-size:13.5px; color:var(--heading);">${alt}</strong>
                    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                      ${slideBadgeHtml}
                      <button type="button" class="sim-btn" style="padding:4px 9px; font-size:11.5px; border-color:var(--blue); color:var(--link); font-weight:700;" onclick="if (window.openGenuineScreenshotLightbox) { openGenuineScreenshotLightbox('${resolved}', '${escapeHtml(alt)}'); } else { window.open('${resolved}', '_blank'); }">&#128269; High-Res &#8599;</button>
                    </div>
                  </div>
                  <div id="inline-fig-img-wrap-${figSlug}">
                    <img id="inline-fig-img-${figSlug}" src="${resolved}?v=${PPTX_CACHE_VER}" alt="${alt}" style="width:auto; max-width:min(100%, 960px); max-height:720px; height:auto; display:block; margin:0; border-radius:6px; cursor:zoom-in;" onclick="if (window.openGenuineScreenshotLightbox) { openGenuineScreenshotLightbox('${resolved}', this.alt); } else { window.open(this.src, '_blank'); }" title="Click to open full-resolution diagram in new tab" />
                  </div>
                </div>`;
                }

                const figSlug = resolved.replace(/[^a-zA-Z0-9_-]/g, '-');

              if (!/^[a-z][a-z0-9+.-]*:/i.test(cleanHref) && !cleanHref.startsWith('/') && (/\.(py|sql|tf|tfvars|yaml|yml|sh|json)$/i.test(cleanHref) || /(2\.6-terraform-starter|3\.6-terraform-silo-blueprint|4\.6-terraform-hybrid-psc-blueprint)\/?$/i.test(cleanHref))) {

        function flushTable() {
          if (!inTable) return;
          inTable = false;
          if (tableRows.length < 2) { tableRows = []; return; }
          const rawHeaders = tableRows[0].split('|').slice(1, -1).map(c => c.trim());
          const numCols = rawHeaders.length;
          const rawRows = tableRows.slice(2).map(r => r.split('|').slice(1, -1).map(c => c.trim()));

          // Dynamic Content-Weighted Column Distribution (Rule 54 & Min-Height Optimization)
          const colLengths = [];
          for (let c = 0; c < numCols; c++) {
            let maxL = rawHeaders[c] ? rawHeaders[c].length : 0;
            let sumL = 0;
            let count = 0;
            rawRows.forEach(r => {
              if (r[c]) {
                const txt = r[c].replace(/<[^>]+>/g, '').replace(/`[^`]+`/g, 'XXXX').trim();
                maxL = Math.max(maxL, txt.length);
                sumL += txt.length;
                count++;
              }
            });
            const avgL = count > 0 ? sumL / count : maxL;
            colLengths.push({ maxL, avgL, blend: Math.sqrt(maxL) * 0.4 + avgL * 0.6 });
          }

          const totalBlend = colLengths.reduce((acc, c) => acc + c.blend, 0) || 1;
          let rawPcts = colLengths.map(c => Math.max(11, (c.blend / totalBlend) * 100));
          if (rawPcts[0] < 17) rawPcts[0] = 17; // Preserve multi-word titles and full badges in Col 1 without ellipsis
          const rawSum = rawPcts.reduce((a, b) => a + b, 0);
          const finalPcts = rawPcts.map(p => Math.round((p / rawSum) * 100));
          const delta = 100 - finalPcts.reduce((a, b) => a + b, 0);
          let maxIdx = 0;
          for (let i = 1; i < finalPcts.length; i++) {
            if (finalPcts[i] > finalPcts[maxIdx]) maxIdx = i;
          }
          finalPcts[maxIdx] += delta;

          const colGroup = `<colgroup>${finalPcts.map(p => `<col style="width:${p}%;">`).join('')}</colgroup>`;
          const headers = rawHeaders.map((c, i) => `<th style="width:${finalPcts[i]}%;">${formatInline(c)}</th>`).join('');
          const bodyRows = rawRows.map(r => {
            const cols = r.map((c, i) => `<td style="width:${finalPcts[i]}%;">${formatInline(c)}</td>`).join('');
            return `<tr>${cols}</tr>`;
          }).join('');
          html += `<div class="gcp-arch-table-wrap" style="overflow-x:auto; margin:20px 0;"><table class="gcp-arch-table">${colGroup}<thead><tr>${headers}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
          tableRows = [];

        function flushQuote() {
          if (!quoteLines.length) return;
          const paragraphs = [];
          let cur = [];
          for (const ql of quoteLines) {
            if (!ql.trim()) {

          if (cur.length) paragraphs.push(cur.join(' '));
          const fullText = paragraphs.join(' ');
          let calloutType = 'info';
          if (fullText.includes('Companion Cloud Architecture Assets') || fullText.includes('Google Slides') || fullText.includes('Google Docs')) {

        function flushUl() {

        function flushAllListsAndBlocks() {

        for (const rawLine of lines) {

                  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:8px;">

                    </span>
                    <span style="font-size:11.5px; color:#64748b;">Click to jump directly to any diagram &amp; interactive flow</span>

    // DOC_SHORT_ALIASES loaded from /js/data.js

    function normalizeRepoPath(p) {
      const out = [];
      for (const seg of String(p).replace(/^\.?\//, '').split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') { out.pop(); continue; }
        out.push(seg);
      }
      return out.join('/');
    }

      const metaEl = document.getElementById('artifact-viewer-meta');

      if (!titleEl || !metaEl || !contentEl) return;
      titleEl.textContent = `Deliverable: ${relPath}`;

      contentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      try {

                  <div style="font-size:12px; color:var(--muted); line-height:1.45; margin-bottom:8px;">${escapeHtml(s.logicalNarrative)}</div>

                  <th style="padding:7px 9px; border-bottom:1px solid var(--border); color:var(--th-text);">Architectural Mechanism &amp; Protocol</th>
                  <th style="padding:7px 9px; border-bottom:1px solid var(--border); color:var(--th-text);">Security &amp; Isolation Control</th>
                  <th style="padding:7px 9px; border-bottom:1px solid var(--border); color:var(--th-text);">Verified Production Outcome</th>

    async function loadHubBlogDoc(relPath, anchorHash) {
      relPath = resolveDocAlias(relPath);
      activeHubDocPath = relPath;
      const ws = GUIDED_WORKSTREAMS[activeHubWsKey];
      const switcher = document.getElementById('hub-doc-switcher');
      if (switcher && ws && Array.isArray(ws.docs)) {
        switcher.style.display = ws.docs.length > 1 ? 'flex' : 'none';
        switcher.style.alignItems = 'center';
        const optionsHtml = ws.docs.map(d => {
          const sel = d.path === relPath ? ' selected' : '';
          return `<option value="${escapeHtml(d.path)}"${sel}>${escapeHtml(d.label)}</option>`;
        }).join('');
        switcher.innerHTML = ws.docs.length > 1 ? `
          <label for="hub-doc-select" style="display:inline-flex; align-items:center; gap:6px; margin:0; font-size:12px; font-weight:700; color:var(--heading);">
            <span>&#128194; Active Deliverable:</span>
            <select id="hub-doc-select" style="width:auto; min-width:230px; padding:5px 26px 5px 10px; font-size:12px; font-weight:600;" onchange="loadHubBlogDoc(this.value)" aria-label="Select Workstream Deliverable Document">
              ${optionsHtml}
            </select>
          </label>
        ` : '';
      }

      const readerEl = document.getElementById('hub-blog-reader');
      const tocEl = document.getElementById('hub-blog-toc');
      const footerEl = document.getElementById('hub-series-footer');
      if (!readerEl) return;
      readerEl.innerHTML = 'Loading workstream publication...';
      try {
        const resp = await fetch(`/api/artifact?path=${encodeURIComponent(relPath)}`);
        const data = await resp.json();
        if (data.error) {
          readerEl.textContent = `Error: ${data.error}`;
          return;
        }
        activeHubRawMd = data.content;
        readerEl.innerHTML = renderMarkdownToHtml(data.content, relPath);
        if (typeof window.enhanceBlogBeforeAfterSection === 'function') { window.enhanceBlogBeforeAfterSection(); }
        if (typeof window.enhanceBlogExecutiveLayout === 'function') { window.enhanceBlogExecutiveLayout(relPath); }

        // Build vertical sticky left TOC rail from h2 elements inside #hub-blog-reader
        // Preserve existing GitHub slug IDs on h2 elements so in-page #anchor links work!
        const h2s = Array.from(readerEl.querySelectorAll('h2'));
        if (tocEl) {
          if (h2s.length > 0) {
            tocEl.innerHTML = `<div class="series-toc-title">On This Page (${h2s.length} Sections)</div>` +
              h2s.map((h, i) => {
                const hid = h.id || ('hub-sec-' + i);
                if (!h.id) h.id = hid;
                const safeHid = hid.replace(/'/g, "\\'");
                return `<a class="series-toc-link ${i === 0 ? 'active' : ''}" onclick="document.querySelectorAll('#hub-blog-toc .series-toc-link').forEach(a=>a.classList.remove('active')); this.classList.add('active'); scrollToReaderAnchor('${safeHid}')">${escapeHtml(h.textContent)}</a>`;
              }).join('');
          } else {
            tocEl.innerHTML = `<div class="series-toc-title">On This Page</div><div class="muted" style="font-size:12px;">Document Overview</div>`;
          }

          // Setup scroll-spy to dynamically track active reading section in left TOC rail
          if (window._hubTocScrollSpyCleanup) {
            window.removeEventListener('scroll', window._hubTocScrollSpyCleanup);
            window._hubTocScrollSpyCleanup = null;
          }
          if (h2s.length > 0) {
            let ticking = false;
            const onScrollSpy = () => {
              if (!ticking) {
                window.requestAnimationFrame(() => {
                  const tocLinks = Array.from(document.querySelectorAll('#hub-blog-toc .series-toc-link'));
                  if (tocLinks.length === h2s.length) {
                    let curIdx = 0;
                    for (let i = 0; i < h2s.length; i++) {
                      const top = h2s[i].getBoundingClientRect().top;
                      if (top <= 140) {
                        curIdx = i;
                      } else {
                        break;
                      }
                    }
                    tocLinks.forEach((a, idx) => {
                      a.classList.toggle('active', idx === curIdx);
                    });
                  }
                  ticking = false;
                });
                ticking = true;
              }
            };
            window.addEventListener('scroll', onScrollSpy, { passive: true });
            window._hubTocScrollSpyCleanup = onScrollSpy;
          }
        }

        // Build Previous / Next Series Part navigation footer
        if (footerEl) {
          const order = ['WS1', 'WS2', 'WS3', 'WS4', 'WS5', 'ALL'];
          const curIdx = order.indexOf(activeHubWsKey);
          const prevKey = curIdx > 0 ? order[curIdx - 1] : null;
          const nextKey = (curIdx >= 0 && curIdx < order.length - 1) ? order[curIdx + 1] : null;
          const prevWs = prevKey ? GUIDED_WORKSTREAMS[prevKey] : null;
          const nextWs = nextKey ? GUIDED_WORKSTREAMS[nextKey] : null;
          footerEl.innerHTML = `
            <div>
              ${prevWs ? `<button type="button" class="sim-btn" onclick="selectGuidedWorkstream('${prevKey}'); document.getElementById('hub-blog-section').scrollIntoView({behavior:'smooth', block:'start'});">&larr; Previous: ${escapeHtml(prevKey)} (${escapeHtml(prevWs.docs[0].label)})</button>` : ''}
            </div>
            <div>
              ${nextWs ? `<button type="button" class="sim-btn primary" onclick="selectGuidedWorkstream('${nextKey}'); document.getElementById('hub-blog-section').scrollIntoView({behavior:'smooth', block:'start'});">Next in Series: ${escapeHtml(nextKey)} (${escapeHtml(nextWs.docs[0].label)}) &rarr;</button>` : ''}
            </div>
          `;
        }
        if (typeof initAllPortalCardHoverToolbars === 'function') {
          initAllPortalCardHoverToolbars();
          applyPersistedCardOverrides();
          renderCommentsDrawerAndInlineBadges();
        }
        const urlParams = new URLSearchParams(window.location.search);
        const activeView = urlParams.get('view');
        if (activeView && activeView !== 'guide' && typeof window.setHubViewMode === 'function') {
          setTimeout(() => window.setHubViewMode(activeView, urlParams.get('target'), true), 50);
        } else {
          const targetHash = anchorHash || (window.location.hash ? window.location.hash.slice(1) : '');
          if (targetHash) {
            setTimeout(() => scrollToReaderAnchor(targetHash), 60);
          }
        }
      } catch (err) {
        readerEl.textContent = `Unable to load blog (${err.message}).`;
      }
    }

    async function openInGoogleWorkspace(wsKey, mode, slideNum, customDocPath, forceSync) {
      closeAllPcDropdowns();
      const key = wsKey || activeHubWsKey || 'WS1';
      const targetMode = (mode || 'slides').toLowerCase();
      const sEntry = (cloudViewerManifest.slides || {})[key];
      const dEntry = (cloudViewerManifest.docs || {})[key];

      const isPrimaryWorkstreamDoc = Boolean(
        dEntry && (!customDocPath || dEntry.mdPath === customDocPath || customDocPath.includes(key.toLowerCase() + '-') || (key === 'ALL' && customDocPath.includes('END-TO-END')))
      );
      if (!forceSync && (!customDocPath || (targetMode === 'docs' && isPrimaryWorkstreamDoc))) {
        if (targetMode === 'slides' && sEntry && (sEntry.webViewLink || sEntry.googleSlidesEditUrl)) {
          window.open(sEntry.webViewLink || sEntry.googleSlidesEditUrl, '_blank', 'noopener,noreferrer');
          return;
        }
        if (targetMode === 'docs' && dEntry && (dEntry.webViewLink || dEntry.googleDocsEditUrl)) {
          window.open(dEntry.webViewLink || dEntry.googleDocsEditUrl, '_blank', 'noopener,noreferrer');
          return;
        }
        if (targetMode === 'pdf') {
          const directPdf = (sEntry && sEntry.googleSlidesPdfUrl)
            ? sEntry.googleSlidesPdfUrl
            : `/api/google-workspace/pdf?key=${encodeURIComponent(key)}&mode=slides`;
          window.open(directPdf, '_blank', 'noopener,noreferrer');
          return;
        }
        if (targetMode === 'pdf-doc' || targetMode === 'doc-pdf') {
          const directPdf = (dEntry && dEntry.googleDocsPdfUrl)
            ? dEntry.googleDocsPdfUrl
            : `/api/google-workspace/pdf?key=${encodeURIComponent(key)}&mode=docs`;
          window.open(directPdf, '_blank', 'noopener,noreferrer');
          return;
        }
      }

      const popup = window.open('about:blank', '_blank');
      if (popup && popup.document) {
        popup.document.write(
          '<!DOCTYPE html><html><body style="background:#f8fafc;color:#0f172a;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">' +
          '<div style="text-align:center;padding:28px;border:1px solid #cbd5e1;border-radius:14px;background:#ffffff;box-shadow:0 10px 25px -5px rgba(0,0,0,0.1);">' +
          '<div style="font-size:18px;font-weight:700;color:#1a73e8;margin-bottom:8px;">☁️ Syncing to Google Workspace (' + targetMode.toUpperCase() + ')...</div>' +
          '<div style="font-size:13px;color:#64748b;">Opening document in Google Drive...</div>' +
          '</div></body></html>'
        );
      }
      try {
        const resp = await fetch('/api/google-workspace/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            key: key,
            mode: targetMode,
            docPath: customDocPath || '',
            force: Boolean(forceSync)
          })
        });
        const data = await resp.json();
        await loadCloudViewerManifest();
      loadPortalCanonicalMetrics();
        if (data && data.url) {
          if (popup) popup.location.href = data.url;
          else window.open(data.url, '_blank', 'noopener,noreferrer');
        } else if (popup) {
          popup.close();
        }
      } catch (err) {
        if (popup) popup.close();
        console.error('Google Workspace sync failed:', err);
      }
    }

    function inferWorkstreamFromDocPath(docPath) {
      const p = String(docPath || '');
      if (p.includes('ws1') || p.includes('workstream-1')) return 'WS1';
      if (p.includes('ws2') || p.includes('workstream-2')) return 'WS2';
      if (p.includes('ws3') || p.includes('workstream-3')) return 'WS3';
      if (p.includes('ws4') || p.includes('workstream-4')) return 'WS4';
      if (p.includes('ws5') || p.includes('workstream-5')) return 'WS5';
      if (p.includes('END-TO-END')) return 'ALL';
      return activeHubWsKey || 'WS1';
    }

          }, 4500);
        }
      }

    function sanitizeRichHtmlFragment(rawHtml) {
      // Strict DOMParser allowlist sanitizer ([FA-09]): drops dangerous subtrees, strips all on*/style/srcdoc attrs & javascript:/data: URLs
      const DROP_TAGS = new Set(['script', 'style', 'iframe', 'frame', 'frameset', 'object', 'embed', 'applet', 'svg', 'math', 'form', 'base', 'meta', 'link', 'noscript', 'template']);
      const ALLOW_TAGS = new Set(['p', 'div', 'span', 'strong', 'b', 'em', 'i', 'u', 's', 'code', 'pre', 'blockquote', 'ul', 'ol', 'li', 'br', 'hr', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'a', 'img', 'sup', 'sub', 'small', 'mark', 'dl', 'dt', 'dd']);
      const GLOBAL_ATTRS = new Set(['class', 'id', 'title', 'role', 'aria-label']);
      const TAG_ATTRS = {
        a: new Set(['href', 'target', 'rel']),
        img: new Set(['src', 'alt', 'width', 'height', 'loading', 'decoding']),
        th: new Set(['colspan', 'rowspan', 'scope']),
        td: new Set(['colspan', 'rowspan'])
      };
      const isSafeUrl = (val, attr) => {
        const cleaned = String(val || '').replace(/[\x00-\x20\x7f]+/g, '');
        if (!cleaned || cleaned.startsWith('//')) return false;
        const m = cleaned.toLowerCase().match(/^([a-z][a-z0-9+.-]*):/);
        if (!m) return true;
        return attr === 'href' ? (m[1] === 'https' || m[1] === 'mailto') : m[1] === 'https';
      };
      const doc = new DOMParser().parseFromString(String(rawHtml || ''), 'text/html');
      const cleanNode = (node) => {
        Array.from(node.childNodes).forEach((child) => {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) return;
          const tag = child.tagName.toLowerCase();
          if (DROP_TAGS.has(tag)) {
            child.remove();
            return;
          }
          cleanNode(child);
          if (!ALLOW_TAGS.has(tag)) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            child.remove();
            return;
          }
          const allowedTagAttrs = TAG_ATTRS[tag] || new Set();
          Array.from(child.attributes).forEach((attr) => {
            const name = attr.name.toLowerCase();
            if (name.startsWith('on') || (!GLOBAL_ATTRS.has(name) && !allowedTagAttrs.has(name))) {
              child.removeAttribute(attr.name);
              return;
            }
            if ((name === 'href' || name === 'src') && !isSafeUrl(attr.value, name)) {
              child.removeAttribute(attr.name);
            }
          });
          if (tag === 'a' && child.getAttribute('target') === '_blank') {
            child.setAttribute('rel', 'noopener noreferrer');
          }
        });
      };
      cleanNode(doc.body);
      return doc.body.innerHTML;
    }

    async function recordPortalChangeLog(payload) {
      const fullPayload = Object.assign({
        userName: portalActiveActor.name,
        userEmail: portalActiveActor.email,
        userRole: portalActiveActor.role,
        workstream: activeHubWsKey || 'WS1',
        docPath: activeHubDocPath || 'blogs/ws1-reference-architecture-taxonomy-and-5hop-baseline.md'
      }, payload || {});

      try {
        const resp = await fetch('/api/changelog', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fullPayload)
        });
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data.entries)) portalChangeLogEntries = data.entries;
          if (data.cardOverrides) portalCardOverrides = data.cardOverrides;
          updateChangeLogCountBadges();
          renderChangeLogTable();
          return data.entry;
        }
        if (resp.status === 401 || resp.status === 403) {
          const errBody = await resp.json().catch(() => ({}));
          showPortalToast('🔒 Admin IAP Required (HTTP ' + resp.status + ')', errBody.error || 'Persistent portal mutations require verified Google Cloud IAP admin login [FA-09].');
        }
      } catch (err) {
        console.warn('Could not persist change log entry to backend:', err);
      }
      return null;
    }

    async function handleCardHoverAction(cardId, action) {
      const cardEl = document.querySelector(`[data-card-id="${cardId}"]`) || document.getElementById(cardId);
      if (!cardEl) return;
      const cardTitle = inferCardTitle(cardEl);
      const diagId = cardEl.getAttribute('data-diag-id') || (cardId === 'hub-diag-section' ? ((GUIDED_WORKSTREAMS[activeHubWsKey]?.diagrams?.[activeHubDiagIdx]?.id) || 'ws1-multi-tenant-taxonomy-overview') : '');
      const editableBody = getEditableTargetForCard(cardEl);

      if (action === 'EDIT') {
        if (diagId) {
          if (cardId === 'hub-diag-section') {
            setHubDiagramRenderMode('edit-inline');
          } else {
            setInlineFigureMode(diagId, 'edit');
          }
          await recordPortalChangeLog({
            action: 'EDIT',
            targetType: 'diagram',
            targetId: diagId,
            targetTitle: cardTitle,
            summary: `Opened inline Draw.io diagram editor for ${diagId}.drawio (${cardTitle}).`
          });
          showPortalToast('✏️ Inline Draw.io Editor Opened', `Editing ${diagId}.drawio — click 💾 Save when done.`);
          return;
        }

        if (!editableBody) return;
        cardBeforeSnapshotMap[cardId] = editableBody.innerText.trim().slice(0, 600);
        cardEl.classList.add('card-is-editing');
        editableBody.setAttribute('contenteditable', 'true');
        editableBody.focus();

        let banner = cardEl.querySelector(':scope > .inline-edit-status-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.className = 'inline-edit-status-banner';
          const safeId = escapeHtml(cardId).replace(/'/g, "\\'");
          banner.innerHTML = `
            <div>&#9999;&#65039; <strong>Inline Editing Mode Active</strong> (${escapeHtml(portalActiveActor.name)}) &mdash; Edit text, tables, or headings directly below:</div>
            <div style="display:flex; gap:6px;">
              <button type="button" class="sim-btn primary" style="padding:4px 10px; font-size:11.5px;" onclick="handleCardHoverAction('${safeId}', 'SAVE')">&#128190; Save Changes</button>
              <button type="button" class="sim-btn" style="padding:4px 10px; font-size:11.5px;" onclick="cancelCardInlineEdit('${safeId}')">&#10005; Cancel</button>
            </div>
          `;
          cardEl.insertBefore(banner, editableBody);
        }
        showPortalToast('✏️ Editing Card Inline', `Now editing "${cardTitle}" as ${portalActiveActor.name}.`);
        return;
      }

      if (action === 'SAVE') {
        if (diagId) {
          if (cardId === 'hub-diag-section') {
            await saveInlineDrawioXml();
          } else {
            const iframeEl = document.getElementById('inline-fig-iframe-' + diagId);
            if (iframeEl && iframeEl.contentWindow && typeof iframeEl.contentWindow.saveCurrentStudioXml === 'function') {
              await iframeEl.contentWindow.saveCurrentStudioXml();
            } else {
              await recordPortalChangeLog({
                action: 'DIAGRAM_SAVE',
                targetType: 'diagram',
                targetId: diagId,
                targetTitle: cardTitle,
                summary: `Saved diagram checkpoint for ${diagId}.drawio (${cardTitle}).`
              });
            }
          }
          await fetchAndRenderChangeLog();
          showPortalToast('💾 Diagram Saved & Logged', `Recorded diagram save by ${portalActiveActor.name} in Change Log.`);
          return;
        }

        if (!editableBody) return;
        const beforeText = cardBeforeSnapshotMap[cardId] || editableBody.innerText.trim().slice(0, 600);
        editableBody.removeAttribute('contenteditable');
        cardEl.classList.remove('card-is-editing');
        const banner = cardEl.querySelector(':scope > .inline-edit-status-banner');
        if (banner) banner.remove();

        const afterHtml = editableBody.innerHTML;
        const afterText = editableBody.innerText.trim().slice(0, 600);
        const newTitle = inferCardTitle(cardEl);
        cardEl.setAttribute('data-card-title', newTitle);

        await recordPortalChangeLog({
          action: 'SAVE',
          targetType: cardEl.getAttribute('data-card-type') || 'blog_section',
          targetId: cardId,
          targetTitle: newTitle,
          summary: `Saved online content edit on "${newTitle}" (${afterText.length} chars).`,
          beforeSnippet: beforeText,
          afterSnippet: afterText,
          htmlContent: afterHtml
        });
        showPortalToast('💾 Saved to Persistent Change Log', `Saved "${newTitle}" by ${portalActiveActor.name}.`);
        return;
      }

      if (action === 'ADD') {
        const newCardId = `${cardId}-added-${Date.now().toString().slice(-5)}`;
        const newCard = document.createElement('div');
        newCard.className = 'card doc-section-card';
        newCard.id = newCardId;
        newCard.setAttribute('data-card-id', newCardId);
        newCard.setAttribute('data-card-type', 'custom_added_card');
        newCard.setAttribute('data-card-title', `New Architecture Note (Added by ${portalActiveActor.name})`);
        newCard.setAttribute('data-doc-path', activeHubDocPath || '');

          <div class="card-editable-body">

        `;
        cardEl.parentNode.insertBefore(newCard, cardEl.nextSibling);
        initAllPortalCardHoverToolbars();
        renderCommentsDrawerAndInlineBadges();

        await recordPortalChangeLog({
          action: 'ADD',
          targetType: 'custom_added_card',
          targetId: newCardId,
          targetTitle: `New Architecture Note (below ${cardTitle})`,
          parentCardId: cardId,
          summary: `Added new section card "${newCardId}" below "${cardTitle}".`,
          beforeSnippet: '(New Card Created)',
          afterSnippet: newCard.querySelector('.card-editable-body').innerText.trim(),
          htmlContent: newCard.querySelector('.card-editable-body').innerHTML
        });
        handleCardHoverAction(newCardId, 'EDIT');

      if (action === 'CLONE') {
        const cloneCardId = `${cardId}-clone-${Date.now().toString().slice(-5)}`;
        const cloneEl = document.createElement('div');
        cloneEl.className = cardEl.className.replace(/\bcard-is-editing\b/g, '').trim();
        cloneEl.id = cloneCardId;
        cloneEl.setAttribute('data-card-id', cloneCardId);
        cloneEl.setAttribute('data-card-type', 'cloned_card');
        const cloneTitle = `${cardTitle} (Cloned Copy)`;
        cloneEl.setAttribute('data-card-title', cloneTitle);
        cloneEl.setAttribute('data-doc-path', activeHubDocPath || '');
        const srcHtml = editableBody ? editableBody.innerHTML : cardEl.innerHTML;
        cloneEl.innerHTML = `<div class="card-editable-body">${srcHtml}</div>`;
        const firstHeading = cloneEl.querySelector('h1, h2, h3, h4, strong');
        if (firstHeading && !firstHeading.textContent.includes('(Cloned Copy)')) {
          firstHeading.innerHTML = `${firstHeading.innerHTML} <span class="badge badge-blue" style="font-size:10.5px;">Cloned by ${escapeHtml(portalActiveActor.name)}</span>`;
        }
        cardEl.parentNode.insertBefore(cloneEl, cardEl.nextSibling);
        initAllPortalCardHoverToolbars();
        renderCommentsDrawerAndInlineBadges();

        await recordPortalChangeLog({
          action: 'CLONE',
          targetType: 'cloned_card',
          targetId: cloneCardId,
          targetTitle: cloneTitle,
          parentCardId: cardId,
          summary: `Cloned card "${cardTitle}" into "${cloneCardId}".`,
          beforeSnippet: editableBody ? editableBody.innerText.trim().slice(0, 400) : '',
          afterSnippet: cloneEl.querySelector('.card-editable-body').innerText.trim().slice(0, 400),
          htmlContent: cloneEl.querySelector('.card-editable-body').innerHTML
        });
        showPortalToast('📋 Card Cloned', `Created duplicate "${cloneTitle}" below original card.`);
        return;
      }

      if (action === 'HIDE') {

            action: 'UNHIDE',
            targetType: cardEl.getAttribute('data-card-type') || 'blog_section',

            targetTitle: cardTitle,

            const safeId = escapeHtml(cardId).replace(/'/g, "\\'");
            unhidePill.innerHTML = `
              <span>&#128584; Hidden Card: <strong>${escapeHtml(cardTitle)}</strong> (Hidden by ${escapeHtml(portalActiveActor.name)})</span>
              <button type="button" class="sim-btn" style="padding:3px 9px; font-size:11px;" onclick="handleCardHoverAction('${safeId}', 'HIDE')">&#128065;&#65039; Unhide Card</button>
            `;

          }
          const unhideAllBtn = document.getElementById('chg-unhide-all-btn');
          if (unhideAllBtn) unhideAllBtn.style.display = 'inline-flex';
          await recordPortalChangeLog({
            action: 'HIDE',
            targetType: cardEl.getAttribute('data-card-type') || 'blog_section',
            targetId: cardId,
            targetTitle: cardTitle,
            summary: `Collapsed/hid card "${cardTitle}" from active reader view.`
          });
          showPortalToast('🙈 Card Hidden', `Hid "${cardTitle}" — click Unhide at any time.`);
        }
        return;
      }

      if (action === 'DELETE') {
        const beforeSnap = editableBody ? editableBody.innerText.trim().slice(0, 600) : cardTitle;
        const savedHtml = editableBody ? editableBody.innerHTML : cardEl.innerHTML;
        cardEl.classList.add('card-is-deleted');
        await recordPortalChangeLog({
          action: 'DELETE',
          targetType: cardEl.getAttribute('data-card-type') || 'blog_section',
          targetId: cardId,
          targetTitle: cardTitle,
          summary: `Deleted card "${cardTitle}" (soft-deleted; restorable in 1 click from Change Log).`,
          beforeSnippet: beforeSnap,
          afterSnippet: '(Deleted)',
          htmlContent: savedHtml
        });
        showPortalToast('🗑️ Card Deleted', `"${cardTitle}" removed. You can restore it anytime from 📜 Change Log.`);
      }
    }

      const hiddenCards = Array.from(document.querySelectorAll('.card-is-hidden'));
      for (const el of hiddenCards) {
        const cid = el.getAttribute('data-card-id') || el.id;
        if (cid) await handleCardHoverAction(cid, 'HIDE');

    function applyPersistedCardOverrides() {
      if (!portalCardOverrides || typeof portalCardOverrides !== 'object') return;
      Object.entries(portalCardOverrides).forEach(([cardId, ov]) => {
        if (!ov || typeof ov !== 'object') return;
        let cardEl = document.querySelector(`[data-card-id="${cardId}"]`) || document.getElementById(cardId);
        if (!cardEl && (ov.status === 'added' || ov.status === 'cloned') && ov.parentCardId) {
          const parentEl = document.querySelector(`[data-card-id="${ov.parentCardId}"]`) || document.getElementById(ov.parentCardId);
          if (parentEl && parentEl.parentNode) {
            cardEl = document.createElement('div');
            cardEl.className = 'card doc-section-card';
            cardEl.id = cardId;
            cardEl.setAttribute('data-card-id', cardId);
            cardEl.setAttribute('data-card-type', ov.status === 'cloned' ? 'cloned_card' : 'custom_added_card');
            cardEl.setAttribute('data-card-title', ov.targetTitle || ov.cardTitle || cardId);
            cardEl.innerHTML = `<div class="card-editable-body">${sanitizeRichHtmlFragment(ov.htmlContent || '')}</div>`;
            parentEl.parentNode.insertBefore(cardEl, parentEl.nextSibling);
          }
        }
        if (!cardEl) return;
        if (ov.status === 'deleted') {
          cardEl.classList.add('card-is-deleted');
        } else {
          cardEl.classList.remove('card-is-deleted');
        }
        if (ov.status === 'hidden') {
          cardEl.classList.add('card-is-hidden');
        } else {
          cardEl.classList.remove('card-is-hidden');
        }
        if (ov.htmlContent && ov.status !== 'deleted') {
          const editableBody = getEditableTargetForCard(cardEl);
          if (editableBody) editableBody.innerHTML = sanitizeRichHtmlFragment(ov.htmlContent);
        }
      });
      initAllPortalCardHoverToolbars();
    }

    function buildThreadCardHtml(thread, isInline) {
      const comments = Array.isArray(thread.comments) ? thread.comments : [];
      const isResolved = thread.status === 'resolved';
      const safeThreadId = escapeHtml(thread.threadId).replace(/'/g, "\\'");
      const replyInputId = `${isInline ? 'inline' : 'drawer'}-reply-input-${thread.threadId}`;
      const activeTargetIdEl = document.getElementById('drawer-target-card-id');
      const isTargetSection = activeTargetIdEl && activeTargetIdEl.value && thread.cardId === activeTargetIdEl.value;
      const secTitle = thread.sectionTitle || thread.cardTitle || thread.cardId || 'Architecture Section';
      return `
        <div class="gdocs-thread-card ${isResolved ? 'resolved' : ''}" data-thread-id="${escapeHtml(thread.threadId)}" style="${isTargetSection ? 'border-color:#93c5fd; box-shadow:0 0 0 2px rgba(26,115,232,0.16);' : ''}">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid #f1f5f9;">
            <div style="font-size:11px; font-weight:700; color:#1a73e8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
              &#128204; ${escapeHtml(secTitle)}
            </div>
            <div style="display:flex; gap:5px; align-items:center; flex-shrink:0;">
              <span class="badge ${isResolved ? 'badge-green' : 'badge-amber'}" style="font-size:10px; padding:1px 6px;">${isResolved ? '✓ Resolved' : '● Open'}</span>
              <button type="button" class="sim-btn" style="padding:2px 7px; font-size:10.5px;" onclick="toggleThreadResolution('${safeThreadId}', '${isResolved ? 'reopen' : 'resolve'}')" title="${isResolved ? 'Reopen Comment Thread' : 'Mark Thread as Resolved'}">
                ${isResolved ? '&#8634; Reopen' : '&#10003; Resolve'}
              </button>
              <button type="button" class="sim-btn" style="padding:2px 6px; font-size:10.5px; color:#dc2626;" onclick="deleteCommentThread('${safeThreadId}')" title="Delete Thread">&#128465;</button>
            </div>
          </div>
          ${thread.quotedText ? `<div class="gdocs-quote-strip">"${escapeHtml(thread.quotedText)}"</div>` : ''}
          <div>
            ${comments.map(c => {
              const cName = c.userName || c.actorName || 'Anonymous';
              const cRole = c.userRole || c.actorRole || c.userEmail || c.actorEmail || '';
              const cTime = c.timestampEst || c.createdAtEst || c.createdAt || '';
              return `
              <div class="gdocs-comment-item">
                <div class="gdocs-comment-header">
                  <div class="gdocs-user-chip">
                    <span class="gdocs-avatar" style="background:${/^#[0-9a-fA-F]{3,8}$/.test(String(c.avatarColor || '').trim()) ? String(c.avatarColor).trim() : '#1a73e8'};">${escapeHtml(c.userInitials || computeInitials(cName))}</span>
                    <div>
                      <div class="gdocs-user-name">${escapeHtml(cName)}</div>
                      <div class="gdocs-user-role">${escapeHtml(cRole)}</div>
                    </div>
                  </div>
                  <div class="gdocs-comment-time">${escapeHtml(cTime)}</div>
                </div>
                <div class="gdocs-comment-body">${escapeHtml(c.text)}</div>
              </div>
            `;
            }).join('')}
          </div>
          <div style="display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid #f1f5f9;">
            <input type="text" id="${replyInputId}" placeholder="Reply as ${escapeHtml(portalActiveActor.name)}..." aria-label="Reply to comment thread" style="flex:1; padding:5px 8px; font-size:11.5px; border:1px solid #cbd5e1; border-radius:6px;" onkeydown="if(event.key==='Enter'){event.preventDefault(); submitThreadReply('${safeThreadId}', '${replyInputId}');}" />
            <button type="button" class="sim-btn primary" style="padding:4px 10px; font-size:11px;" onclick="submitThreadReply('${safeThreadId}', '${replyInputId}')">Reply</button>
          </div>

    function renderCommentsDrawerAndInlineBadges() {
      const statusFilterEl = document.getElementById('drawer-filter-status');
      const statusFilter = statusFilterEl ? statusFilterEl.value : 'ALL';
      const openThreads = portalCommentThreads.filter(t => t.status !== 'resolved');
      const totalCommentCount = portalCommentThreads.reduce((acc, t) => acc + (Array.isArray(t.comments) ? t.comments.length : 0), 0);

      // Update global comment counters
      const drwBadge = document.getElementById('drawer-comments-count-badge');
      if (drwBadge) drwBadge.textContent = `${openThreads.length} Open (${portalCommentThreads.length} Total)`;
      const navCnt = document.getElementById('nav-comments-count');
      if (navCnt) navCnt.textContent = String(portalCommentThreads.length);
      const chgBtnCnt = document.getElementById('chg-btn-comments-count');
      if (chgBtnCnt) chgBtnCnt.textContent = String(portalCommentThreads.length);
      const kpiComments = document.getElementById('chg-kpi-comments');
      if (kpiComments) kpiComments.textContent = `${portalCommentThreads.length} Threads (${totalCommentCount} Comments)`;

      // Render Right-Side Google Docs / Slides Comments Drawer (prioritize active target card's threads at top)
      const listEl = document.getElementById('gdocs-drawer-threads-list');
      if (listEl) {
        const activeTargetIdEl = document.getElementById('drawer-target-card-id');
        const activeCardId = activeTargetIdEl ? activeTargetIdEl.value : '';
        const filtered = portalCommentThreads.filter(t => {
          if (statusFilter === 'open') return t.status !== 'resolved';
          if (statusFilter === 'resolved') return t.status === 'resolved';
          return true;
        }).slice().sort((a, b) => {
          const aMatch = a.cardId === activeCardId ? 1 : 0;
          const bMatch = b.cardId === activeCardId ? 1 : 0;
          return bMatch - aMatch;
        });
        if (!filtered.length) {
          listEl.innerHTML = `<div class="muted" style="text-align:center; padding:24px 12px; font-size:12.5px;">No comment threads match the selected filter. Click the <code>&#128172;</code> icon on any card to start a discussion.</div>`;
        } else {
          listEl.innerHTML = filtered.map(t => buildThreadCardHtml(t, false)).join('');
        }
      }

      // Update per-card hover toolbar comment icon badge (no separate inline comment box)
      const allCards = Array.from(document.querySelectorAll('[data-card-id]'));
      allCards.forEach(cardEl => {
        const cid = cardEl.getAttribute('data-card-id');
        const cardThreads = portalCommentThreads.filter(t => t.cardId === cid);
        const cardCommentCount = cardThreads.reduce((acc, t) => acc + (Array.isArray(t.comments) ? t.comments.length : 0), 0);

        const cmtBtn = cardEl.querySelector(':scope > .card-hover-toolbar .comment-btn');
        if (cmtBtn) {
          cmtBtn.classList.toggle('has-comments', cardCommentCount > 0);
          cmtBtn.title = cardCommentCount > 0
            ? `Comments (${cardCommentCount}) — Click to view or add comments in drawer`
            : 'Open Google Docs / Slides Multi-User Comments Drawer for This Section';
          const badge = cmtBtn.querySelector('.card-toolbar-comment-badge');
          if (badge) {
            badge.textContent = cardCommentCount > 0 ? String(cardCommentCount) : '';
          }
        }
      });
    }

            text,

            avatarColor: portalActiveActor.avatarColor || '#1a73e8'

    async function fetchAndRenderChangeLog() {

        if (resp.ok) {
          const data = await resp.json();
          if (data.activeActor && data.activeActor.iapVerified) {
            portalActiveActor = {
              name: data.activeActor.actorName || portalActiveActor.name,
              email: data.activeActor.actorEmail || portalActiveActor.email,
              role: data.activeActor.actorRole || portalActiveActor.role,
              avatarColor: '#1a73e8',
              iapVerified: true,
              isAdmin: Boolean(data.activeActor.isAdmin)
            };
            syncActorUiElements();
          }
          if (Array.isArray(data.entries)) portalChangeLogEntries = data.entries;
          if (data.cardOverrides) portalCardOverrides = data.cardOverrides;
          updateChangeLogCountBadges();
          applyPersistedCardOverrides();
          renderChangeLogTable();
        }
      } catch (err) {
        console.warn('Could not load change log:', err);
      }

    function getActionBadgeHtml(action) {
      const a = String(action || 'SAVE').toUpperCase();
      if (a === 'SAVE' || a === 'DIAGRAM_SAVE') return `<span class="badge badge-green">&#128190; ${escapeHtml(a)}</span>`;
      if (a === 'ADD' || a === 'CLONE') return `<span class="badge badge-blue">&#10133; ${escapeHtml(a)}</span>`;
      if (a === 'DELETE') return `<span class="badge badge-red">&#128465; ${escapeHtml(a)}</span>`;
      if (a === 'HIDE' || a === 'UNHIDE') return `<span class="badge badge-purple">&#128584; ${escapeHtml(a)}</span>`;
      if (a.startsWith('COMMENT')) return `<span class="badge badge-amber">&#128172; ${escapeHtml(a)}</span>`;

    function renderChangeLogTable() {
      const tbody = document.getElementById('changelog-table-body');
      const emptyEl = document.getElementById('chg-empty-state');
      if (!tbody) return;

      const q = (document.getElementById('chg-search-input')?.value || '').trim().toLowerCase();
      const actionFilter = document.getElementById('chg-filter-action')?.value || 'ALL';
      const actorFilter = document.getElementById('chg-filter-actor')?.value || 'ALL';
      const wsFilter = document.getElementById('chg-filter-ws')?.value || 'ALL';

      const filtered = portalChangeLogEntries.filter(e => {
        const uName = e.userName || e.actorName || '';
        const uEmail = e.userEmail || e.actorEmail || '';
        const uRole = e.userRole || e.actorRole || '';
        const tId = e.targetId || e.cardId || '';
        const tTitle = e.targetTitle || e.cardTitle || tId;
        const bSnip = e.beforeSnippet || e.beforeText || '';
        const aSnip = e.afterSnippet || e.afterText || '';
        if (actionFilter !== 'ALL') {
          if (actionFilter === 'HIDE' && !['HIDE', 'UNHIDE'].includes(e.action)) return false;
          else if (actionFilter === 'COMMENT' && !String(e.action || '').startsWith('COMMENT')) return false;
          else if (!['HIDE', 'COMMENT'].includes(actionFilter) && e.action !== actionFilter) return false;
        }
        if (actorFilter !== 'ALL' && uName !== actorFilter) return false;
        if (wsFilter !== 'ALL') {
          const checkWs = wsFilter === 'ALL_DECK' ? 'ALL' : wsFilter;
          if (e.workstream !== checkWs) return false;
        }
        if (q) {
          const hay = [
            e.id, uName, uEmail, uRole, e.action,
            tId, tTitle, e.workstream, e.docPath,
            e.summary, bSnip, aSnip
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (emptyEl) emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';

      tbody.innerHTML = filtered.map(e => {
        const uName = e.userName || e.actorName || 'Anonymous';
        const uEmail = e.userEmail || e.actorEmail || '';

        const aSnip = e.afterSnippet || e.afterText || '';
        const tsEst = e.timestampEst || e.createdAtEst || '';
        const safeEntryId = escapeHtml(e.id).replace(/'/g, "\\'");
        const safeCardId = escapeHtml(tId).replace(/'/g, "\\'");
        const canRestore = Boolean(tId && ['DELETE', 'HIDE', 'SAVE', 'ADD', 'CLONE'].includes(e.action));
        return `
          <tr>
            <td style="white-space:nowrap;">
              <code>${escapeHtml(e.id)}</code>
              <div class="muted" style="font-size:11px; margin-top:2px;">${escapeHtml(tsEst)}</div>
            </td>
            <td>
              <div style="display:flex; align-items:center; gap:7px;">
                <span class="gdocs-avatar" style="background:#1a73e8; width:22px; height:22px; font-size:10px;">${escapeHtml(computeInitials(uName))}</span>
                <div>
                  <strong style="font-size:12.5px; color:var(--heading);">${escapeHtml(uName)}</strong>
                  <div class="muted" style="font-size:11px;">${escapeHtml(uEmail)} &bull; ${escapeHtml(uRole)}</div>
                </div>
              </div>
            </td>
            <td>${getActionBadgeHtml(e.action)}</td>
            <td>
              <strong style="font-size:12.5px;">${escapeHtml(tTitle)}</strong>
              <div class="muted" style="font-size:11px;"><code>${escapeHtml(tId)}</code> (${escapeHtml(tType)})</div>
            </td>
            <td>
              <span class="badge badge-blue">${escapeHtml(e.workstream || 'WS1')}</span>
              <div class="muted" style="font-size:11px; margin-top:2px; word-break:break-all;">${escapeHtml(e.docPath || '')}</div>
            </td>
            <td style="font-size:12px; max-width:340px;">
              <div>${escapeHtml(e.summary || '')}</div>
              ${(bSnip || aSnip) ? `

    async function restoreCardFromChangeLog(cardId) {
      if (!cardId) return;
      try {
        const resp = await fetch('/api/changelog/restore', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            targetId: cardId,
            userName: portalActiveActor.name,
            userEmail: portalActiveActor.email,
            userRole: portalActiveActor.role
          })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data.entries)) portalChangeLogEntries = data.entries;
          if (data.cardOverrides) portalCardOverrides = data.cardOverrides;
          const el = document.querySelector(`[data-card-id="${cardId}"]`) || document.getElementById(cardId);
          if (el) {
            el.classList.remove('card-is-deleted', 'card-is-hidden');
            const unhidePill = el.querySelector(':scope > .card-hidden-placeholder-bar');
            if (unhidePill) unhidePill.remove();
          }
          if (activeHubDocPath) await loadHubBlogDoc(activeHubDocPath);
          updateChangeLogCountBadges();
          renderChangeLogTable();
          showPortalToast('↩️ Card Restored', `Restored "${cardId}" and recorded audit entry.`);
        } else if (resp.status === 401 || resp.status === 403) {
          const errBody = await resp.json().catch(() => ({}));
          showPortalToast('🔒 Admin IAP Required (HTTP ' + resp.status + ')', errBody.error || 'Restoring card overrides requires verified Google Cloud IAP admin login [FA-09].');
        }
      } catch (err) {
        console.warn('Error restoring card:', err);
      }
    }

    function exportChangeLogCsv() {
      const headers = ['Audit_ID', 'Timestamp_EST', 'User_Name', 'User_Email', 'User_Role', 'Action', 'Target_Type', 'Target_ID', 'Target_Title', 'Workstream', 'Doc_Path', 'Summary'];
      const rows = portalChangeLogEntries.map(e => [
        e.id, e.timestampEst || e.createdAtEst, e.userName || e.actorName, e.userEmail || e.actorEmail, e.userRole || e.actorRole, e.action,
        e.targetType, e.targetId || e.cardId, e.targetTitle || e.cardTitle, e.workstream, e.docPath, e.summary
      ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','));
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'portal_change_log_audit.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    (function installBeyondCorpFetchGuard() {
      if (typeof window.fetch !== 'function' || window.__beyondCorpFetchGuardInstalled) return;
      window.__beyondCorpFetchGuardInstalled = true;
      const origFetch = window.fetch.bind(window);
      window.fetch = async function guardedFetch(input, init) {
        const urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        const isApiCall = urlStr.startsWith('/api/') || urlStr.startsWith(window.location.origin + '/api/');
        try {
          const resp = await origFetch(input, init);
          const respCt = (resp.headers && resp.headers.get ? (resp.headers.get('content-type') || '') : '').toLowerCase();
          if (isApiCall && (resp.type === 'opaqueredirect' || (window.location.hostname.endsWith('.cr.gclb.goog') && (resp.status === 401 || resp.status === 403) && !respCt.includes('application/json')))) {
            window.__showBeyondCorpSessionExpiredBanner();

          return resp;
        } catch (err) {
          if (isApiCall && window.location.hostname.endsWith('.cr.gclb.goog')) {

          }

      if (!stage) return;
      const rangeEl = stage.querySelector('input[type="range"]');
      if (rangeEl) rangeEl.value = String(pct);

      const div = stage.querySelector('.ba-3p-slider-divider');

    window.copySaaSModalField = function copySaaSModalField(field, btn) {
      const key = window._currentSaaSModalKey;
      const data = window.SAAS_CONNECT_REGISTRY[key];
      if (!data) return;
      let text = '';
      if (field === 'user') text = data.username;
      else if (field === 'pass' || field === 'secret') text = 'gcloud secrets versions access latest --secret=cymbal-saas-demo-credentials --project=bbar-138hf0';
      else if (field === 'proxy') text = data.proxyCmd;
      if (!text) return;

      function markCopied() {
        const orig = btn.textContent;
        btn.textContent = '✓ Copied!';
        btn.style.color = '#15803d';
        setTimeout(() => {
          btn.textContent = orig;
          btn.style.color = '';
        }, 1500);
      }

      function execCommandFallback(str) {
        const ta = document.createElement('textarea');
        ta.value = str;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          markCopied();
        } catch (e) {
          console.warn('execCommand fallback failed', e);
        }
        document.body.removeChild(ta);
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(markCopied).catch(() => {
          execCommandFallback(text);
        });
      } else {
        execCommandFallback(text);
      }
    };

    // =========================================================================
    // WCAG 2.2 AA/AAA ACCESSIBLE MODAL & DRAWER FOCUS TRAP AND ESCAPE MANAGER [FA-50]
    // =========================================================================
    (function initAccessibleModalManager() {
      let _lastActiveElement = null;

      const MODAL_REGISTRY = [
        { id: 'genuine-ui-lightbox-modal', close: () => window.closeGenuineScreenshotLightbox && window.closeGenuineScreenshotLightbox() },
        { id: 'saas-connect-modal', close: () => window.closeSaaSConnectModal && window.closeSaaSConnectModal() },
        { id: 'portal-faq-modal', close: () => window.closePortalFAQ && window.closePortalFAQ() },
        { id: 'pc-cloud-viewer-modal', close: () => window.closeCloudViewerModal && window.closeCloudViewerModal() },
        { id: 'changelog-diff-drawer', close: () => window.closeChangeLogDiffDrawer && window.closeChangeLogDiffDrawer() },
        { id: 'gdocs-comments-drawer', close: () => window.closeCommentsDrawer && window.closeCommentsDrawer() },
        { id: 'telemetry-drawer', close: () => window.closeTelemetryDrawer && window.closeTelemetryDrawer() }
      ];

      function getOpenModals() {
        return MODAL_REGISTRY.map(m => {
          const el = document.getElementById(m.id);
          return (el && el.classList.contains('open')) ? { ...m, el } : null;
        }).filter(Boolean);
      }

      function getFocusableElements(container) {
        if (!container) return [];
        const selector = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
        const list = Array.from(container.querySelectorAll(selector));
        return list.filter(el => {
          return el.offsetWidth > 0 || el.offsetHeight > 0 || el.getClientRects().length > 0;
        });
      }

      window.__recordModalOpenTrigger = function(triggerEl) {
        _lastActiveElement = triggerEl || document.activeElement;
      };

      window.__restoreModalFocus = function() {
        if (_lastActiveElement && typeof _lastActiveElement.focus === 'function') {
          try {
            _lastActiveElement.focus();
          } catch (_) {}
          _lastActiveElement = null;
        }
      };

      document.addEventListener('keydown', (ev) => {
        const openList = getOpenModals();
        if (openList.length === 0) return;
        const currentModal = openList[openList.length - 1];

        if (ev.key === 'Escape') {
          ev.preventDefault();
          currentModal.close();
          setTimeout(() => {
            if (getOpenModals().length === 0) {
              window.__restoreModalFocus();
            }
          }, 30);
          return;
        }

        if (ev.key === 'Tab') {
          const focusables = getFocusableElements(currentModal.el);
          if (focusables.length === 0) {
            ev.preventDefault();
            return;
          }
          const first = focusables[0];
          const last = focusables[focusables.length - 1];

          if (ev.shiftKey) {
            if (document.activeElement === first || !currentModal.el.contains(document.activeElement)) {
              ev.preventDefault();
              last.focus();
            }
          } else {
            if (document.activeElement === last || !currentModal.el.contains(document.activeElement)) {
              ev.preventDefault();
              first.focus();
            }
          }
        }
      });

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
            const target = mutation.target;
            if (target.classList && target.classList.contains('open')) {
              if (!_lastActiveElement && document.activeElement && document.activeElement !== document.body) {
                _lastActiveElement = document.activeElement;
              }
              const focusables = getFocusableElements(target);
              if (focusables.length > 0) {
                setTimeout(() => {
                  try {
                    if (!target.contains(document.activeElement)) {
                      focusables[0].focus();
                    }
                  } catch (_) {}
                }, 40);
              }
            } else if (target.classList && !target.classList.contains('open')) {
              if (getOpenModals().length === 0) {
                window.__restoreModalFocus();
              }
            }
          }
        }
      });

      MODAL_REGISTRY.forEach(m => {
        const el = document.getElementById(m.id);
        if (el) {
          observer.observe(el, { attributes: true, attributeFilter: ['class'] });
        }
      });
    })();
  </script>
